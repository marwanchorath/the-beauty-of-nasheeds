n:t,ref:a}),q0=[{id:"al-quds",title:"Al-Qudsu Tunadeena",ar:"\u0627\u0644\u0642\u062F\u0633 \u062A\u0646\u0627\u062F\u064A\u0646\u0627",meaning:"Jerusalem Is Calling Us",album:"Al-Qudsu Tunadeena",year:2e3,lang:"Arabic",theme:"Al-Quds and Al-Aqsa hold a place in every Muslim heart. The title gives the city a voice of its own, calling the Ummah to remember it.",known:!1,verse:O("\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0623\u064E\u0633\u0652\u0631\u064E\u0649\u0670 \u0628\u0650\u0639\u064E\u0628\u0652\u062F\u0650\u0647\u0650 \u0644\u064E\u064A\u0652\u0644\u064B\u0627 \u0645\u0650\u0651\u0646\u064E \u0627\u0644\u0652\u0645\u064E\u0633\u0652\u062C\u0650\u062F\u0650 \u0627\u0644\u0652\u062D\u064E\u0631\u064E\u0627\u0645\u0650 \u0625\u0650\u0644\u064E\u0649 \u0627\u0644\u0652\u0645\u064E\u0633\u0652\u062C\u0650\u062F\u0650 \u0627\u0644\u0652\u0623\u064E\u0642\u0652\u0635\u064E\u0649 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0628\u064E\u0627\u0631\u064E\u0643\u0652\u0646\u064E\u0627 \u062D\u064E\u0648\u0652\u0644\u064E\u0647\u064F","Glory be to the One who carried His servant by night from the Sacred Mosque to the Farthest Mosque, whose surroundings We have blessed.","Al-Isra 17:1"),scene:"dome",tags:["Ummah","Al-Quds"]},{id:"waqafa",title:"Waqafa Al-Tiflu",ar:"\u0648\u0642\u0641 \u0627\u0644\u0637\u0641\u0644",meaning:"The Child Stood",album:"Al-Qudsu Tunadeena",year:2e3,lang:"Arabic",theme:"A child standing firm, on an album dedicated to Al-Quds. It asks how much courage the young carry, and how much we owe them.",known:!1,verse:O("\u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u062D\u0652\u0633\u064E\u0628\u064E\u0646\u064E\u0651 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u063A\u064E\u0627\u0641\u0650\u0644\u064B\u0627 \u0639\u064E\u0645\u064E\u0651\u0627 \u064A\u064E\u0639\u0652\u0645\u064E\u0644\u064F \u0627\u0644\u0638\u064E\u0651\u0627\u0644\u0650\u0645\u064F\u0648\u0646\u064E","Never think that Allah is unaware of what the wrongdoers do.","Ibrahim 14:42"),scene:"mountain",tags:["Ummah","Children"]},{id:"taweel",title:"Taweel Al-Shawq",ar:"\u0637\u0648\u064A\u0644 \u0627\u0644\u0634\u0648\u0642",meaning:"Long Is the Yearning",album:"Al-Qudsu Tunadeena",year:2e3,lang:"Arabic",theme:"Shawq is the heart's deep longing. The title names a yearning that has lasted a long time: the believer's longing to meet what he loves.",known:!1,verse:O("\u0645\u064E\u0646 \u0643\u064E\u0627\u0646\u064E \u064A\u064E\u0631\u0652\u062C\u064F\u0648 \u0644\u0650\u0642\u064E\u0627\u0621\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0641\u064E\u0625\u0650\u0646\u064E\u0651 \u0623\u064E\u062C\u064E\u0644\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0644\u064E\u0622\u062A\u064D","Whoever hopes to meet Allah: the term Allah has set is surely coming.","Al-Ankabut 29:5"),scene:"night",tags:["Longing"]},{id:"ramadan",title:"Nasheed Ramadan",ar:"\u0646\u0634\u064A\u062F \u0631\u0645\u0636\u0627\u0646",meaning:"A Nasheed for Ramadan",album:"Al-Qudsu Tunadeena",year:2e3,lang:"Arabic",theme:"A welcome to the month of fasting, the Qur'an and mercy, the month that resets the soul.",known:!1,verse:O("\u064A\u064E\u0627 \u0623\u064E\u064A\u064F\u0651\u0647\u064E\u0627 \u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u0622\u0645\u064E\u0646\u064F\u0648\u0627 \u0643\u064F\u062A\u0650\u0628\u064E \u0639\u064E\u0644\u064E\u064A\u0652\u0643\u064F\u0645\u064F \u0627\u0644\u0635\u0650\u0651\u064A\u064E\u0627\u0645\u064F \u0643\u064E\u0645\u064E\u0627 \u0643\u064F\u062A\u0650\u0628\u064E \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u0645\u0650\u0646 \u0642\u064E\u0628\u0652\u0644\u0650\u0643\u064F\u0645\u0652 \u0644\u064E\u0639\u064E\u0644\u064E\u0651\u0643\u064F\u0645\u0652 \u062A\u064E\u062A\u064E\u0651\u0642\u064F\u0648\u0646\u064E","O you who believe, fasting is prescribed for you as it was for those before you, so that you may become mindful of Allah.","Al-Baqarah 2:183"),scene:"lantern",tags:["Ramadan","Worship"]},{id:"zayed",title:"Zayed Al-Khair",ar:"\u0632\u0627\u064A\u062F \u0627\u0644\u062E\u064A\u0631",meaning:"Zayed of Goodness",album:"Al-Qudsu Tunadeena",year:2e3,lang:"Arabic",theme:"A tribute to Sheikh Zayed, founding father of the UAE, remembered across the region for his generosity.",known:!1,verse:O("\u0648\u064E\u0623\u064E\u062D\u0652\u0633\u0650\u0646 \u0643\u064E\u0645\u064E\u0627 \u0623\u064E\u062D\u0652\u0633\u064E\u0646\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0625\u0650\u0644\u064E\u064A\u0652\u0643\u064E","Do good, just as Allah has done good to you.","Al-Qasas 28:77"),scene:"oasis",tags:["Homeland","Gratitude"]},{id:"ajaban",title:"Ajaban",ar:"\u0639\u062C\u0628\u064B\u0627",meaning:"How Astonishing!",album:"Entasaf Al-Layl",year:2001,lang:"Arabic",theme:"An exclamation of wonder, perhaps at the signs of Allah, perhaps at how heedless a person can be. It is meant to wake you up.",known:!1,verse:O("\u064A\u064E\u0627 \u0623\u064E\u064A\u064F\u0651\u0647\u064E\u0627 \u0627\u0644\u0652\u0625\u0650\u0646\u0633\u064E\u0627\u0646\u064F \u0645\u064E\u0627 \u063A\u064E\u0631\u064E\u0651\u0643\u064E \u0628\u0650\u0631\u064E\u0628\u0650\u0651\u0643\u064E \u0627\u0644\u0652\u0643\u064E\u0631\u0650\u064A\u0645\u0650","O mankind, what has deceived you about your Lord, the Most Generous?","Al-Infitar 82:6"),scene:"star",tags:["Reflection"]},{id:"kam-tashtaki",title:"Kam Tashtaki",ar:"\u0643\u0645 \u062A\u0634\u062A\u0643\u064A",meaning:"How Much You Complain",album:"Entasaf Al-Layl",year:2001,lang:"Arabic",theme:"A gentle challenge to the habit of complaining: count your blessings, and take your sorrows to the One who can lift them.",known:!1,verse:O("\u0625\u0650\u0646\u064E\u0651\u0645\u064E\u0627 \u0623\u064E\u0634\u0652\u0643\u064F\u0648 \u0628\u064E\u062B\u0650\u0651\u064A \u0648\u064E\u062D\u064F\u0632\u0652\u0646\u0650\u064A \u0625\u0650\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650","I complain of my grief and sorrow only to Allah.","Yusuf 12:86"),scene:"rain",tags:["Patience","Gratitude"]},{id:"ya-adheeman",title:"Ya Adheeman",ar:"\u064A\u0627 \u0639\u0638\u064A\u0645\u064B\u0627",meaning:"O Most Great One",album:"Fartaqi",year:2003,lang:"Arabic",theme:"A call to Allah by His greatness. It is one of his best-loved nasheeds, a voice humbled before the Most Great.",known:!1,verse:O("\u0641\u064E\u0633\u064E\u0628\u0650\u0651\u062D\u0652 \u0628\u0650\u0627\u0633\u0652\u0645\u0650 \u0631\u064E\u0628\u0650\u0651\u0643\u064E \u0627\u0644\u0652\u0639\u064E\u0638\u0650\u064A\u0645\u0650","So glorify the name of your Lord, the Most Great.","Al-Waqi'ah 56:74"),scene:"night",tags:["Worship","Allah"]},{id:"al-hijab",title:"Al-Hijab",ar:"\u0627\u0644\u062D\u062C\u0627\u0628",meaning:"The Hijab",album:"Fartaqi",year:2003,lang:"Arabic",theme:"Hijab as dignity and devotion, an honour freely carried. He was composing on this theme as early as 1993.",known:!1,verse:O("\u0648\u064E\u0644\u0652\u064A\u064E\u0636\u0652\u0631\u0650\u0628\u0652\u0646\u064E \u0628\u0650\u062E\u064F\u0645\u064F\u0631\u0650\u0647\u0650\u0646\u064E\u0651 \u0639\u064E\u0644\u064E\u0649\u0670 \u062C\u064F\u064A\u064F\u0648\u0628\u0650\u0647\u0650\u0646\u064E\u0651","Let them draw their head-coverings over their chests.","An-Nur 24:31"),scene:"lantern",tags:["Modesty"]},{id:"kitab-allah",title:"Kitab Allah",ar:"\u0643\u062A\u0627\u0628 \u0627\u0644\u0644\u0647",meaning:"The Book of Allah",album:"Fartaqi",year:2003,lang:"Arabic",theme:"Love for the Qur'an. He grew up studying tajwid, the rules of recitation, at an Islamic centre in Sharjah.",known:!1,verse:O("\u0625\u0650\u0646\u064E\u0651 \u0647\u064E\u0670\u0630\u064E\u0627 \u0627\u0644\u0652\u0642\u064F\u0631\u0652\u0622\u0646\u064E \u064A\u064E\u0647\u0652\u062F\u0650\u064A \u0644\u0650\u0644\u064E\u0651\u062A\u0650\u064A \u0647\u0650\u064A\u064E \u0623\u064E\u0642\u0652\u0648\u064E\u0645\u064F","This Qur'an guides to what is most upright.","Al-Isra 17:9"),scene:"book",tags:["Qur'an"]},{id:"dar-al-ghurur",title:"Dar Al-Ghurur",ar:"\u062F\u0627\u0631 \u0627\u0644\u063A\u0631\u0648\u0631",meaning:"The Abode of Illusion",album:"Fartaqi",year:2003,lang:"Arabic",theme:"The Qur'an's own name for this world: a place that dazzles and deceives. The title asks you to hold it lightly.",known:!1,verse:O("\u0648\u064E\u0645\u064E\u0627 \u0627\u0644\u0652\u062D\u064E\u064A\u064E\u0627\u0629\u064F \u0627\u0644\u062F\u064F\u0651\u0646\u0652\u064A\u064E\u0627 \u0625\u0650\u0644\u064E\u0651\u0627 \u0645\u064E\u062A\u064E\u0627\u0639\u064F \u0627\u0644\u0652\u063A\u064F\u0631\u064F\u0648\u0631\u0650","The life of this world is nothing but the enjoyment of illusion.","Al Imran 3:185"),scene:"path",tags:["Dunya","Reflection"]},{id:"fartaqi",title:"Fartaqi",ar:"\u0641\u0627\u0631\u062A\u0642\u064A",meaning:"So Rise!",album:"Fartaqi",year:2003,lang:"Arabic",theme:"The title track is a call to climb: in faith, in character, in knowledge. Rise above what holds you down.",known:!1,verse:O("\u064A\u064E\u0631\u0652\u0641\u064E\u0639\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u0622\u0645\u064E\u0646\u064F\u0648\u0627 \u0645\u0650\u0646\u0643\u064F\u0645\u0652 \u0648\u064E\u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u0623\u064F\u0648\u062A\u064F\u0648\u0627 \u0627\u0644\u0652\u0639\u0650\u0644\u0652\u0645\u064E \u062F\u064E\u0631\u064E\u062C\u064E\u0627\u062A\u064D","Allah raises by degrees those of you who believe and those given knowledge.","Al-Mujadilah 58:11"),scene:"mountain",tags:["Growth"]},{id:"talib",title:"Talib Al-Ilm",ar:"\u0637\u0627\u0644\u0628 \u0627\u0644\u0639\u0644\u0645",meaning:"The Seeker of Knowledge",album:"Fartaqi",year:2003,lang:"Arabic",theme:"Honouring the student. In Islam the road to knowledge is itself a road toward Paradise.",known:!1,verse:O("\u0648\u064E\u0642\u064F\u0644 \u0631\u064E\u0651\u0628\u0650\u0651 \u0632\u0650\u062F\u0652\u0646\u0650\u064A \u0639\u0650\u0644\u0652\u0645\u064B\u0627","And say: My Lord, increase me in knowledge.","Ta-Ha 20:114"),scene:"book",tags:["Knowledge"]},{id:"ya-eid",title:"Ya Eid",ar:"\u064A\u0627 \u0639\u064A\u062F",meaning:"O Eid!",album:"Fartaqi",year:2003,lang:"Arabic",theme:"A greeting to the day of Eid, sung with Humood Al-Khudher and Muhammad Obaid: joy, family, and thanks to Allah.",known:!0,verse:O("\u0648\u064E\u0644\u0650\u062A\u064F\u0643\u0652\u0645\u0650\u0644\u064F\u0648\u0627 \u0627\u0644\u0652\u0639\u0650\u062F\u064E\u0651\u0629\u064E \u0648\u064E\u0644\u0650\u062A\u064F\u0643\u064E\u0628\u0650\u0651\u0631\u064F\u0648\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0645\u064E\u0627 \u0647\u064E\u062F\u064E\u0627\u0643\u064F\u0645\u0652 \u0648\u064E\u0644\u064E\u0639\u064E\u0644\u064E\u0651\u0643\u064F\u0645\u0652 \u062A\u064E\u0634\u0652\u0643\u064F\u0631\u064F\u0648\u0646\u064E","So complete the count, magnify Allah for guiding you, and perhaps you will be grateful.","Al-Baqarah 2:185"),scene:"lantern",tags:["Eid","Joy"]},{id:"ya-man-yara",title:"Ya Man Yara",ar:"\u064A\u0627 \u0645\u0646 \u064A\u0631\u0649",meaning:"O You Who Sees",album:"Fartaqi",year:2003,lang:"Arabic",theme:"Addressing Allah as the One who sees everything: every hidden tear, every secret act. One of the first nasheeds he ever composed, in 1993.",known:!1,verse:O("\u0623\u064E\u0644\u064E\u0645\u0652 \u064A\u064E\u0639\u0652\u0644\u064E\u0645 \u0628\u0650\u0623\u064E\u0646\u064E\u0651 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u064A\u064E\u0631\u064E\u0649\u0670","Does he not know that Allah sees?","Al-Alaq 96:14"),scene:"night",tags:["Allah","Ihsan"]},{id:"ummi",title:"Ummi",ar:"\u0623\u0645\u064A",meaning:"My Mother",album:"Samtan",year:2003,lang:"Arabic",theme:"A son's love for his mother. Also one of his very first compositions, from 1993.",known:!1,verse:O("\u0648\u064E\u0642\u064E\u0636\u064E\u0649\u0670 \u0631\u064E\u0628\u064F\u0651\u0643\u064E \u0623\u064E\u0644\u064E\u0651\u0627 \u062A\u064E\u0639\u0652\u0628\u064F\u062F\u064F\u0648\u0627 \u0625\u0650\u0644\u064E\u0651\u0627 \u0625\u0650\u064A\u064E\u0651\u0627\u0647\u064F \u0648\u064E\u0628\u0650\u0627\u0644\u0652\u0648\u064E\u0627\u0644\u0650\u062F\u064E\u064A\u0652\u0646\u0650 \u0625\u0650\u062D\u0652\u0633\u064E\u0627\u0646\u064B\u0627","Your Lord has decreed that you worship none but Him, and that you be excellent to your parents.","Al-Isra 17:23"),scene:"hands",tags:["Family","Parents"]},{id:"sharjah",title:"Nasheed Al-Shariqah",ar:"\u0646\u0634\u064A\u062F \u0627\u0644\u0634\u0627\u0631\u0642\u0629",meaning:"Anthem of Sharjah",album:"Samtan",year:2003,lang:"Arabic",theme:"For Sharjah, his home city: gratitude for a place that raised him on the Qur'an.",known:!1,verse:O("\u0641\u064E\u0628\u0650\u0623\u064E\u064A\u0650\u0651 \u0622\u0644\u064E\u0627\u0621\u0650 \u0631\u064E\u0628\u0650\u0651\u0643\u064F\u0645\u064E\u0627 \u062A\u064F\u0643\u064E\u0630\u0650\u0651\u0628\u064E\u0627\u0646\u0650","So which of your Lord's favours will you deny?","Ar-Rahman 55:13"),scene:"city",tags:["Homeland","Gratitude"]},{id:"mubhirun",title:"Mubhirun",ar:"\u0645\u0628\u062D\u0631\u0648\u0646",meaning:"We Are Setting Sail",album:"Samtan",year:2003,lang:"Arabic",theme:"A voyage. Life is a sea crossing, and the believer steers by Allah.",known:!1,verse:O("\u0648\u064E\u0647\u064F\u0648\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0633\u064E\u062E\u064E\u0651\u0631\u064E \u0627\u0644\u0652\u0628\u064E\u062D\u0652\u0631\u064E \u0644\u0650\u062A\u064E\u0623\u0652\u0643\u064F\u0644\u064F\u0648\u0627 \u0645\u0650\u0646\u0652\u0647\u064F \u0644\u064E\u062D\u0652\u0645\u064B\u0627 \u0637\u064E\u0631\u0650\u064A\u064B\u0651\u0627","It is He who made the sea of service to you, so you may eat fresh meat from it.","An-Nahl 16:14"),scene:"sea",tags:["Journey"]},{id:"linantaliq",title:"Linantaliq",ar:"\u0644\u0646\u0646\u0637\u0644\u0642",meaning:"Let Us Set Off",album:"Samtan",year:2003,lang:"Arabic",theme:"A call to start moving now, toward good and toward Allah, before the chance passes.",known:!1,verse:O("\u0641\u064E\u0641\u0650\u0631\u064F\u0651\u0648\u0627 \u0625\u0650\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650","So flee to Allah.","Adh-Dhariyat 51:50"),scene:"path",tags:["Journey","Action"]},{id:"kayfa",title:"Kayfa Anzahoo",ar:null,meaning:"How Can I\u2026? (a question to the heart)",album:"Samtan",year:2003,lang:"Arabic",theme:'The title opens with "Kayfa", "How\u2026?": a question asked from the heart. Listen, and let the question become yours.',known:!1,verse:O("\u0623\u064E\u0644\u064E\u0627 \u0628\u0650\u0630\u0650\u0643\u0652\u0631\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0637\u0652\u0645\u064E\u0626\u0650\u0646\u064F\u0651 \u0627\u0644\u0652\u0642\u064F\u0644\u064F\u0648\u0628\u064F","Truly, in the remembrance of Allah hearts find rest.","Ar-Ra'd 13:28"),scene:"star",tags:["Reflection"]},{id:"last-breath",title:"Last Breath",ar:null,meaning:"Last Breath (English)",album:"Samtan",year:2003,lang:"English",theme:"The nasheed that made him known worldwide. It stays with the final moments of a life, and with what truly matters when every breath runs out.",known:!0,verse:O("\u0643\u064F\u0644\u064F\u0651 \u0646\u064E\u0641\u0652\u0633\u064D \u0630\u064E\u0627\u0626\u0650\u0642\u064E\u0629\u064F \u0627\u0644\u0652\u0645\u064E\u0648\u0652\u062A\u0650","Every soul will taste death.","Al Imran 3:185"),scene:"dawn",tags:["Death","Reflection"]},{id:"daani",title:"Da'ani",ar:"\u062F\u0639\u0627\u0646\u064A",meaning:"He Called Me",album:"Da'ani",year:2005,lang:"Arabic",theme:"The title track: being called. An invitation to answer Allah's call, and to call on Him in return.",known:!1,verse:O("\u0648\u064E\u0642\u064E\u0627\u0644\u064E \u0631\u064E\u0628\u064F\u0651\u0643\u064F\u0645\u064F \u0627\u062F\u0652\u0639\u064F\u0648\u0646\u0650\u064A \u0623\u064E\u0633\u0652\u062A\u064E\u062C\u0650\u0628\u0652 \u0644\u064E\u0643\u064F\u0645\u0652","Your Lord has said: Call on Me, and I will answer you.","Ghafir 40:60"),scene:"hands",tags:["Du'a"]},{id:"thalassemia",title:"Thalassemia",ar:"\u062B\u0644\u0627\u0633\u064A\u0645\u064A\u0627",meaning:"Thalassemia",album:"Da'ani",year:2005,lang:"Arabic",theme:"A community nasheed on thalassemia, an inherited blood disorder: compassion for those who live with it, and the life-giving value of donating blood.",known:!0,verse:O("\u0648\u064E\u0645\u064E\u0646\u0652 \u0623\u064E\u062D\u0652\u064A\u064E\u0627\u0647\u064E\u0627 \u0641\u064E\u0643\u064E\u0623\u064E\u0646\u064E\u0651\u0645\u064E\u0627 \u0623\u064E\u062D\u0652\u064A\u064E\u0627 \u0627\u0644\u0646\u064E\u0651\u0627\u0633\u064E \u062C\u064E\u0645\u0650\u064A\u0639\u064B\u0627","Whoever saves one life, it is as if he saved all of mankind.","Al-Ma'idah 5:32"),scene:"drop",tags:["Community","Compassion"]},{id:"its-time",title:"It's Time",ar:null,meaning:"It's Time (English)",album:"Da'ani",year:2005,lang:"English",theme:"Urgency: stop delaying, turn back, change today rather than tomorrow.",known:!1,verse:O("\u0648\u064E\u0633\u064E\u0627\u0631\u0650\u0639\u064F\u0648\u0627 \u0625\u0650\u0644\u064E\u0649\u0670 \u0645\u064E\u063A\u0652\u0641\u0650\u0631\u064E\u0629\u064D \u0645\u0650\u0651\u0646 \u0631\u064E\u0651\u0628\u0650\u0651\u0643\u064F\u0645\u0652 \u0648\u064E\u062C\u064E\u0646\u064E\u0651\u0629\u064D \u0639\u064E\u0631\u0652\u0636\u064F\u0647\u064E\u0627 \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0648\u064E\u0627\u062A\u064F \u0648\u064E\u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u064F","Hasten to forgiveness from your Lord, and a Garden as wide as the heavens and the earth.","Al Imran 3:133"),scene:"dawn",tags:["Repentance","Action"]},{id:"iqra",title:"Iqra",ar:"\u0627\u0642\u0631\u0623",meaning:"Read!",album:"Da'ani",year:2005,lang:"Arabic",theme:"The first word revealed to the Prophet \uFDFA. A command that built a civilisation of learning.",known:!1,verse:O("\u0627\u0642\u0652\u0631\u064E\u0623\u0652 \u0628\u0650\u0627\u0633\u0652\u0645\u0650 \u0631\u064E\u0628\u0650\u0651\u0643\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u062E\u064E\u0644\u064E\u0642\u064E","Read, in the name of your Lord who created.","Al-Alaq 96:1"),scene:"book",tags:["Qur'an","Knowledge"]},{id:"naseem",title:"Naseem Al-Shawq",ar:"\u0646\u0633\u064A\u0645 \u0627\u0644\u0634\u0648\u0642",meaning:"Breeze of Yearning",album:"Da'ani",year:2005,lang:"Arabic",theme:"Longing that arrives softly, like a breeze: the soul's yearning for its Lord and for Paradise.",known:!1,verse:O("\u0648\u064F\u062C\u064F\u0648\u0647\u064C \u064A\u064E\u0648\u0652\u0645\u064E\u0626\u0650\u0630\u064D \u0646\u064E\u0651\u0627\u0636\u0650\u0631\u064E\u0629\u064C \u06DD \u0625\u0650\u0644\u064E\u0649\u0670 \u0631\u064E\u0628\u0650\u0651\u0647\u064E\u0627 \u0646\u064E\u0627\u0638\u0650\u0631\u064E\u0629\u064C","Some faces that Day will be radiant, looking toward their Lord.","Al-Qiyamah 75:22\u201323"),scene:"oasis",tags:["Longing","Jannah"]},{id:"forgive-me",title:"Forgive Me",ar:null,meaning:"Forgive Me (English)",album:"Da'ani",year:2005,lang:"English",theme:"One of the album's two most popular tracks. It offers encouragement to people living with disabilities, honouring their strength and worth.",known:!0,verse:O("\u0644\u064E\u0627 \u064A\u064F\u0643\u064E\u0644\u0650\u0651\u0641\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0646\u064E\u0641\u0652\u0633\u064B\u0627 \u0625\u0650\u0644\u064E\u0651\u0627 \u0648\u064F\u0633\u0652\u0639\u064E\u0647\u064E\u0627","Allah does not burden any soul beyond what it can bear.","Al-Baqarah 2:286"),scene:"hands",tags:["Community","Compassion"]},{id:"ya-akhi",title:"Ya Akhi",ar:"\u064A\u0627 \u0623\u062E\u064A",meaning:"O My Brother",album:"Da'ani",year:2005,lang:"Arabic",theme:"A tribute to a brother: the bond of brotherhood, in blood and in faith.",known:!0,verse:O("\u0625\u0650\u0646\u064E\u0651\u0645\u064E\u0627 \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E \u0625\u0650\u062E\u0652\u0648\u064E\u0629\u064C","The believers are but brothers.","Al-Hujurat 49:10"),scene:"mountain",tags:["Family","Brotherhood"]},{id:"zawjati",title:"Zawjati",ar:"\u0632\u0648\u062C\u062A\u064A",meaning:"My Wife",album:"Da'ani",year:2005,lang:"Arabic",theme:"One of his most loved nasheeds. A tribute to the role of the wife: her patience, care, and the peace she brings to a home.",known:!0,verse:O("\u0648\u064E\u0645\u0650\u0646\u0652 \u0622\u064A\u064E\u0627\u062A\u0650\u0647\u0650 \u0623\u064E\u0646\u0652 \u062E\u064E\u0644\u064E\u0642\u064E \u0644\u064E\u0643\u064F\u0645 \u0645\u0650\u0651\u0646\u0652 \u0623\u064E\u0646\u0641\u064F\u0633\u0650\u0643\u064F\u0645\u0652 \u0623\u064E\u0632\u0652\u0648\u064E\u0627\u062C\u064B\u0627 \u0644\u0650\u0651\u062A\u064E\u0633\u0652\u0643\u064F\u0646\u064F\u0648\u0627 \u0625\u0650\u0644\u064E\u064A\u0652\u0647\u064E\u0627 \u0648\u064E\u062C\u064E\u0639\u064E\u0644\u064E \u0628\u064E\u064A\u0652\u0646\u064E\u0643\u064F\u0645 \u0645\u064E\u0651\u0648\u064E\u062F\u064E\u0651\u0629\u064B \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064B","Among His signs: He created spouses for you from among yourselves so you may find tranquillity in them, and placed between you love and mercy.","Ar-Rum 30:21"),scene:"oasis",tags:["Family","Marriage"]},{id:"ya-bunaya",title:"Ya Bunaya",ar:null,meaning:"O My Dear Child",album:"Hasanat",year:2007,lang:"Arabic",theme:"A parent speaking tenderly to a child, in the spirit of Luqman's famous advice to his son. Its video clip was directed by Mohammed Al Ajami.",known:!1,verse:O("\u064A\u064E\u0627 \u0628\u064F\u0646\u064E\u064A\u064E\u0651 \u0623\u064E\u0642\u0650\u0645\u0650 \u0627\u0644\u0635\u064E\u0651\u0644\u064E\u0627\u0629\u064E \u0648\u064E\u0623\u0652\u0645\u064F\u0631\u0652 \u0628\u0650\u0627\u0644\u0652\u0645\u064E\u0639\u0652\u0631\u064F\u0648\u0641\u0650 \u0648\u064E\u0627\u0646\u0652\u0647\u064E \u0639\u064E\u0646\u0650 \u0627\u0644\u0652\u0645\u064F\u0646\u0643\u064E\u0631\u0650 \u0648\u064E\u0627\u0635\u0652\u0628\u0650\u0631\u0652 \u0639\u064E\u0644\u064E\u0649\u0670 \u0645\u064E\u0627 \u0623\u064E\u0635\u064E\u0627\u0628\u064E\u0643\u064E","My dear son, establish prayer, enjoin good, forbid evil, and be patient with whatever befalls you.","Luqman 31:17"),scene:"hands",tags:["Family","Children"]},{id:"sunna",title:"Sunna' Al-Hayat",ar:"\u0635\u0646\u0627\u0639 \u0627\u0644\u062D\u064A\u0627\u0629",meaning:"Makers of Life",album:"Hasanat",year:2007,lang:"Arabic",theme:"A call to be people who build: who make life better for those around them instead of waiting for change.",known:!1,verse:O("\u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u0644\u064E\u0627 \u064A\u064F\u063A\u064E\u064A\u0650\u0651\u0631\u064F \u0645\u064E\u0627 \u0628\u0650\u0642\u064E\u0648\u0652\u0645\u064D \u062D\u064E\u062A\u064E\u0651\u0649\u0670 \u064A\u064F\u063A\u064E\u064A\u0650\u0651\u0631\u064F\u0648\u0627 \u0645\u064E\u0627 \u0628\u0650\u0623\u064E\u0646\u0641\u064F\u0633\u0650\u0647\u0650\u0645\u0652","Allah does not change a people's condition until they change what is within themselves.","Ar-Ra'd 13:11"),scene:"city",tags:["Action","Community"]},{id:"dont-let-me-go",title:"Don't Let Me Go!",ar:null,meaning:"Don't Let Me Go! (English)",album:"Hasanat",year:2007,lang:"English",theme:"A plea to stay held, to not be left to oneself. The believer's prayer to remain guided.",known:!1,verse:O("\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0644\u064E\u0627 \u062A\u064F\u0632\u0650\u063A\u0652 \u0642\u064F\u0644\u064F\u0648\u0628\u064E\u0646\u064E\u0627 \u0628\u064E\u0639\u0652\u062F\u064E \u0625\u0650\u0630\u0652 \u0647\u064E\u062F\u064E\u064A\u0652\u062A\u064E\u0646\u064E\u0627","Our Lord, do not let our hearts swerve after You have guided us.","Al Imran 3:8"),scene:"rain",tags:["Du'a"]},{id:"ayuhal-hadi",title:"Ayyuhal Hadi",ar:"\u0623\u064A\u0647\u0627 \u0627\u0644\u0647\u0627\u062F\u064A",meaning:"O Guide",album:"Hasanat",year:2007,lang:"Arabic",theme:"Addressing the one who guides: the Prophet \uFDFA, through whom guidance reached mankind.",known:!1,verse:O("\u0648\u064E\u0625\u0650\u0646\u064E\u0651\u0643\u064E \u0644\u064E\u062A\u064E\u0647\u0652\u062F\u0650\u064A \u0625\u0650\u0644\u064E\u0649\u0670 \u0635\u0650\u0631\u064E\u0627\u0637\u064D \u0645\u064F\u0651\u0633\u0652\u062A\u064E\u0642\u0650\u064A\u0645\u064D","And you surely guide to a straight path.","Ash-Shura 42:52"),scene:"path",tags:["Prophet \uFDFA"]},{id:"hijab-en",title:"Hijab",ar:null,meaning:"Hijab (English)",album:"Hasanat",year:2007,lang:"English",theme:"He returns to the hijab, this time in English: a message of honour for Muslim women everywhere.",known:!1,verse:O("\u064A\u064E\u0627 \u0623\u064E\u064A\u064F\u0651\u0647\u064E\u0627 \u0627\u0644\u0646\u064E\u0651\u0628\u0650\u064A\u064F\u0651 \u0642\u064F\u0644 \u0644\u0650\u0651\u0623\u064E\u0632\u0652\u0648\u064E\u0627\u062C\u0650\u0643\u064E \u0648\u064E\u0628\u064E\u0646\u064E\u0627\u062A\u0650\u0643\u064E \u0648\u064E\u0646\u0650\u0633\u064E\u0627\u0621\u0650 \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u0650\u064A\u0646\u064E \u064A\u064F\u062F\u0652\u0646\u0650\u064A\u0646\u064E \u0639\u064E\u0644\u064E\u064A\u0652\u0647\u0650\u0646\u064E\u0651 \u0645\u0650\u0646 \u062C\u064E\u0644\u064E\u0627\u0628\u0650\u064A\u0628\u0650\u0647\u0650\u0646\u064E\u0651","O Prophet, tell your wives, your daughters and the believing women to draw their outer garments over themselves.","Al-Ahzab 33:59"),scene:"lantern",tags:["Modesty"]},{id:"khair",title:"Khair Al-Khalq",ar:"\u062E\u064A\u0631 \u0627\u0644\u062E\u0644\u0642",meaning:"The Best of Creation",album:"Hasanat",year:2007,lang:"Arabic",theme:"Love for the Prophet Muhammad \uFDFA, the best of all creation in character and in mercy.",known:!1,verse:O("\u0648\u064E\u0625\u0650\u0646\u064E\u0651\u0643\u064E \u0644\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u062E\u064F\u0644\u064F\u0642\u064D \u0639\u064E\u0638\u0650\u064A\u0645\u064D","And you are surely of a magnificent character.","Al-Qalam 68:4"),scene:"dome",tags:["Prophet \uFDFA"]},{id:"allah-almighty",title:"Allah Almighty",ar:null,meaning:"Allah Almighty (English)",album:"Hasanat",year:2007,lang:"English",theme:"Praise of Allah in English: His oneness, His power, His mercy.",known:!1,verse:O("\u0642\u064F\u0644\u0652 \u0647\u064F\u0648\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u062D\u064E\u062F\u064C \u06DD \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0627\u0644\u0635\u064E\u0651\u0645\u064E\u062F\u064F","Say: He is Allah, the One. Allah, the Eternal Refuge.","Al-Ikhlas 112:1\u20132"),scene:"star",tags:["Allah","Tawhid"]},{id:"hasanat",title:"Hasanat",ar:"\u062D\u0633\u0646\u0627\u062A",meaning:"Good Deeds",album:"Hasanat",year:2007,lang:"Arabic",theme:"The title track: good deeds, small and large, piling up like treasure, and erasing the bad.",known:!1,verse:O("\u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0652\u062D\u064E\u0633\u064E\u0646\u064E\u0627\u062A\u0650 \u064A\u064F\u0630\u0652\u0647\u0650\u0628\u0652\u0646\u064E \u0627\u0644\u0633\u064E\u0651\u064A\u0650\u0651\u0626\u064E\u0627\u062A\u0650","Indeed, good deeds wipe away bad deeds.","Hud 11:114"),scene:"star",tags:["Good Deeds"]},{id:"atfaluna",title:"Atfaluna",ar:"\u0623\u0637\u0641\u0627\u0644\u0646\u0627",meaning:"Our Children",album:"Hasanat",year:2007,lang:"Arabic",theme:"Our children are a trust: their joy, their upbringing, and the future they will carry.",known:!1,verse:O("\u0627\u0644\u0652\u0645\u064E\u0627\u0644\u064F \u0648\u064E\u0627\u0644\u0652\u0628\u064E\u0646\u064F\u0648\u0646\u064E \u0632\u0650\u064A\u0646\u064E\u0629\u064F \u0627\u0644\u0652\u062D\u064E\u064A\u064E\u0627\u0629\u0650 \u0627\u0644\u062F\u064F\u0651\u0646\u0652\u064A\u064E\u0627 \u06D6 \u0648\u064E\u0627\u0644\u0652\u0628\u064E\u0627\u0642\u0650\u064A\u064E\u0627\u062A\u064F \u0627\u0644\u0635\u064E\u0651\u0627\u0644\u0650\u062D\u064E\u0627\u062A\u064F \u062E\u064E\u064A\u0652\u0631\u064C \u0639\u0650\u0646\u062F\u064E \u0631\u064E\u0628\u0650\u0651\u0643\u064E \u062B\u064E\u0648\u064E\u0627\u0628\u064B\u0627","Wealth and children are the adornment of worldly life, but lasting good deeds are better with your Lord in reward.","Al-Kahf 18:46"),scene:"oasis",tags:["Children","Family"]},{id:"i-still-ask",title:"I Still Ask",ar:null,meaning:"I Still Ask (English)",album:"Hasanat",year:2007,lang:"English",theme:"Keep asking. A heart that turns to Allah again and again, and never stops hoping.",known:!1,verse:O("\u0648\u064E\u0625\u0650\u0630\u064E\u0627 \u0633\u064E\u0623\u064E\u0644\u064E\u0643\u064E \u0639\u0650\u0628\u064E\u0627\u062F\u0650\u064A \u0639\u064E\u0646\u0650\u0651\u064A \u0641\u064E\u0625\u0650\u0646\u0650\u0651\u064A \u0642\u064E\u0631\u0650\u064A\u0628\u064C \u06D6 \u0623\u064F\u062C\u0650\u064A\u0628\u064F \u062F\u064E\u0639\u0652\u0648\u064E\u0629\u064E \u0627\u0644\u062F\u064E\u0651\u0627\u0639\u0650 \u0625\u0650\u0630\u064E\u0627 \u062F\u064E\u0639\u064E\u0627\u0646\u0650","When My servants ask you about Me: I am near. I answer the call of the caller when he calls on Me.","Al-Baqarah 2:186"),scene:"hands",tags:["Du'a"]},{id:"remember-them",title:"Remember Them",ar:null,meaning:"Remember Them (English)",album:"Moments with Allah",year:2010,lang:"English",theme:"Don't forget: those who came before us, those who are gone, those who suffer far away. Keep them in your prayers.",known:!1,verse:O("\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u064E\u0646\u064E\u0627 \u0648\u064E\u0644\u0650\u0625\u0650\u062E\u0652\u0648\u064E\u0627\u0646\u0650\u0646\u064E\u0627 \u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u0633\u064E\u0628\u064E\u0642\u064F\u0648\u0646\u064E\u0627 \u0628\u0650\u0627\u0644\u0652\u0625\u0650\u064A\u0645\u064E\u0627\u0646\u0650","Our Lord, forgive us and our brothers who preceded us in faith.","Al-Hashr 59:10"),scene:"rain",tags:["Ummah","Du'a"]},{id:"donya",title:"Donya Al-Bashar",ar:"\u062F\u0646\u064A\u0627 \u0627\u0644\u0628\u0634\u0631",meaning:"The World of Mankind",album:"Moments with Allah",year:2010,lang:"Arabic",theme:"The human world, with its noise and struggle, seen through the honour Allah gave to the children of Adam.",known:!1,verse:O("\u0648\u064E\u0644\u064E\u0642\u064E\u062F\u0652 \u0643\u064E\u0631\u064E\u0651\u0645\u0652\u0646\u064E\u0627 \u0628\u064E\u0646\u0650\u064A \u0622\u062F\u064E\u0645\u064E","We have certainly honoured the children of Adam.","Al-Isra 17:70"),scene:"city",tags:["Dunya","Reflection"]},{id:"hold-these-days",title:"Hold These Days",ar:null,meaning:"Hold These Days (English)",album:"Moments with Allah",year:2010,lang:"English",theme:"Time slips away. Hold on to your days and spend them well, because they will not come back.",known:!1,verse:O("\u0648\u064E\u0627\u0644\u0652\u0639\u064E\u0635\u0652\u0631\u0650 \u06DD \u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0652\u0625\u0650\u0646\u0633\u064E\u0627\u0646\u064E \u0644\u064E\u0641\u0650\u064A \u062E\u064F\u0633\u0652\u0631\u064D","By time! Mankind is surely in loss.","Al-Asr 103:1\u20132"),scene:"dawn",tags:["Time"]},{id:"la-ilaha",title:"La Ilaha Illallah",ar:"\u0644\u0627 \u0625\u0644\u0647 \u0625\u0644\u0627 \u0627\u0644\u0644\u0647",meaning:"There Is No God but Allah",album:"Moments with Allah",year:2010,lang:"Arabic",theme:"The testimony at the heart of Islam: its meaning, its weight, its light.",known:!1,verse:O("\u0641\u064E\u0627\u0639\u0652\u0644\u064E\u0645\u0652 \u0623\u064E\u0646\u064E\u0651\u0647\u064F \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F","So know that there is no god but Allah.","Muhammad 47:19"),scene:"star",tags:["Tawhid"]},{id:"mudh",title:"Mudh 'Araftu Allah",ar:"\u0645\u0630 \u0639\u0631\u0641\u062A \u0627\u0644\u0644\u0647",meaning:"Ever Since I Came to Know Allah",album:"Moments with Allah",year:2010,lang:"Arabic",theme:"How a life changes once the heart truly knows its Lord.",known:!1,verse:O("\u0647\u064F\u0648\u064E \u0627\u0644\u0652\u0623\u064E\u0648\u064E\u0651\u0644\u064F \u0648\u064E\u0627\u0644\u0652\u0622\u062E\u0650\u0631\u064F \u0648\u064E\u0627\u0644\u0638\u064E\u0651\u0627\u0647\u0650\u0631\u064F \u0648\u064E\u0627\u0644\u0652\u0628\u064E\u0627\u0637\u0650\u0646\u064F \u06D6 \u0648\u064E\u0647\u064F\u0648\u064E \u0628\u0650\u0643\u064F\u0644\u0650\u0651 \u0634\u064E\u064A\u0652\u0621\u064D \u0639\u064E\u0644\u0650\u064A\u0645\u064C","He is the First and the Last, the Manifest and the Hidden, and He has knowledge of all things.","Al-Hadid 57:3"),scene:"night",tags:["Allah"]},{id:"nihayat",title:"Nihayat Ghurba",ar:"\u0646\u0647\u0627\u064A\u0629 \u063A\u0631\u0628\u0629",meaning:"The End of Exile",album:"Moments with Allah",year:2010,lang:"Arabic",theme:"Ghurba is the feeling of being a stranger. The title imagines the moment that loneliness ends.",known:!1,verse:O("\u0628\u064E\u062F\u064E\u0623\u064E \u0627\u0644\u0625\u0650\u0633\u0652\u0644\u064E\u0627\u0645\u064F \u063A\u064E\u0631\u0650\u064A\u0628\u064B\u0627\u060C \u0648\u064E\u0633\u064E\u064A\u064E\u0639\u064F\u0648\u062F\u064F \u0643\u064E\u0645\u064E\u0627 \u0628\u064E\u062F\u064E\u0623\u064E \u063A\u064E\u0631\u0650\u064A\u0628\u064B\u0627\u060C \u0641\u064E\u0637\u064F\u0648\u0628\u064E\u0649 \u0644\u0650\u0644\u0652\u063A\u064F\u0631\u064E\u0628\u064E\u0627\u0621\u0650","Islam began as something strange, and it will return to being strange as it began, so glad tidings to the strangers.","Hadith \xB7 Sahih Muslim"),scene:"path",tags:["Longing"]},{id:"pourquoi",title:"Pourquoi les hommes pleurent",ar:null,meaning:"Why Do Men Cry? (French)",album:"Moments with Allah",year:2010,lang:"French",theme:"His first ever French nasheed. It asks what moves a man to tears, and finds no shame in a heart that softens.",known:!0,verse:O("\u062A\u064E\u0631\u064E\u0649\u0670 \u0623\u064E\u0639\u0652\u064A\u064F\u0646\u064E\u0647\u064F\u0645\u0652 \u062A\u064E\u0641\u0650\u064A\u0636\u064F \u0645\u0650\u0646\u064E \u0627\u0644\u062F\u064E\u0651\u0645\u0652\u0639\u0650 \u0645\u0650\u0645\u064E\u0651\u0627 \u0639\u064E\u0631\u064E\u0641\u064F\u0648\u0627 \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u062D\u064E\u0642\u0650\u0651","You see their eyes overflowing with tears because of the truth they have recognised.","Al-Ma'idah 5:83"),scene:"rain",tags:["Reflection"]},{id:"udata",title:"Udata Durra",ar:null,meaning:"A Pearl (from the title's 'durra')",album:"Moments with Allah",year:2010,lang:"Arabic",theme:"Durra means a pearl: something rare, precious and protected. Listen for what he calls a pearl.",known:!1,verse:O("\u0641\u064E\u0627\u0630\u0652\u0643\u064F\u0631\u064F\u0648\u0646\u0650\u064A \u0623\u064E\u0630\u0652\u0643\u064F\u0631\u0652\u0643\u064F\u0645\u0652 \u0648\u064E\u0627\u0634\u0652\u0643\u064F\u0631\u064F\u0648\u0627 \u0644\u0650\u064A \u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u0643\u0652\u0641\u064F\u0631\u064F\u0648\u0646\u0650","So remember Me and I will remember you. Be grateful to Me and do not deny Me.","Al-Baqarah 2:152"),scene:"sea",tags:["Reflection"]},{id:"ya-ilahi",title:"Ya Ilahi",ar:"\u064A\u0627 \u0625\u0644\u0647\u064A",meaning:"O My God",album:"Moments with Allah",year:2010,lang:"Arabic",theme:"A private conversation with Allah: hope, regret, and certainty that His mercy is greater than any sin.",known:!1,verse:O("\u0642\u064F\u0644\u0652 \u064A\u064E\u0627 \u0639\u0650\u0628\u064E\u0627\u062F\u0650\u064A\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u0623\u064E\u0633\u0652\u0631\u064E\u0641\u064F\u0648\u0627 \u0639\u064E\u0644\u064E\u0649\u0670 \u0623\u064E\u0646\u0641\u064F\u0633\u0650\u0647\u0650\u0645\u0652 \u0644\u064E\u0627 \u062A\u064E\u0642\u0652\u0646\u064E\u0637\u064F\u0648\u0627 \u0645\u0650\u0646 \u0631\u064E\u0651\u062D\u0652\u0645\u064E\u0629\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Say: O My servants who have wronged themselves, do not despair of Allah's mercy.","Az-Zumar 39:53"),scene:"hands",tags:["Du'a","Repentance"]},{id:"yusuf",title:"Yosif",ar:"\u064A\u0648\u0633\u0641",meaning:"Yusuf (Joseph)",album:"Moments with Allah",year:2010,lang:"Arabic",theme:"The Prophet Yusuf: betrayed, thrown in a well, imprisoned, and raised up. The most beautiful of stories, about patience that never gave up hope.",known:!1,verse:O("\u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u064A\u0652\u0623\u064E\u0633\u064F\u0648\u0627 \u0645\u0650\u0646 \u0631\u064E\u0651\u0648\u0652\u062D\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650","And never despair of relief from Allah.","Yusuf 12:87"),scene:"mountain",tags:["Patience","Prophets"]}];var kt=[{id:"bukhatir",name:"Ahmed Bukhatir",ar:"\u0623\u062D\u0645\u062F \u0628\u0648\u062E\u0627\u0637\u0631",origin:"Sharjah, UAE",years:"b. 1975",line:"A voice trained on tajwid, singing without instruments by conviction.",facts:["Studied Qur'anic recitation as a child at an Islamic centre in Sharjah","Released seven albums between 2000 and 2010","Last Breath carried his voice far beyond the Arab world","Named among the 500 Most Influential Muslims in 2009"]},{id:"alafasy",name:"Mishary Rashid Alafasy",ar:"\u0645\u0634\u0627\u0631\u064A \u0631\u0627\u0634\u062F \u0627\u0644\u0639\u0641\u0627\u0633\u064A",origin:"Kuwait",years:"b. 1976",line:"An imam and reciter whose nasheeds build rhythm from layered voices alone.",facts:["Imam of the Grand Mosque in Kuwait City","Studied the ten qira'at and tafsir at the Islamic University of Madinah","Has recorded nasheeds in Japanese, Turkish, English and French","Also recorded the classical pre-Islamic Mu'allaqat odes"]},{id:"muqit",name:"Muhammad al-Muqit",ar:"\u0645\u062D\u0645\u062F \u0627\u0644\u0645\u0642\u064A\u0637",origin:"Riyadh, Saudi Arabia",years:"b. 1989",line:"Quiet, intimate nasheeds that became some of the most-streamed in the Gulf.",facts:["Releases his work in a numbered series, Anasheeds Vol. 1 to Vol. 10","Writes many of his own lyrics","The Way of the Tears and I Rise are his best known","One of the most-listened-to Saudi artists on Spotify"]},{id:"arada",name:"Mishary Al-Arada",ar:"\u0645\u0634\u0627\u0631\u064A \u0627\u0644\u0639\u0631\u0627\u062F\u0629",origin:"Kuwait",years:"1982 \u2013 2018",line:"Remembered for one nasheed about the grave that the whole region knows.",facts:["Farshi Al-Turab (2004) became his signature","Performed in the UK, Indonesia and Australia","Died in a road accident in Saudi Arabia, aged 35","Fellow reciters, Alafasy among them, mourned him publicly"]},{id:"tarek",name:"Mohamed Tarek",ar:"\u0645\u062D\u0645\u062F \u0637\u0627\u0631\u0642",origin:"",years:"",line:"Voices that stand in for drums and synths: a nasheed with no instruments that sounds full.",facts:["Best known for Tawakkaltu Fi Rizqi 'Ala Allah (2019)","His backing vocals imitate percussion and synthesizers"]},{id:"omar-esa",name:"Omar Esa",ar:null,origin:"London, UK",years:"Since 2011",line:"\u201CMy voice is my instrument\u201D: a former R&B singer who turned to voice-only nasheeds.",facts:["Sang his first nasheed in late 2011; debut album in 2012","Sings in English, Urdu and Arabic, using only his voice","Allah and His Beloved reached No. 3 on the iTunes UK chart","An outspoken advocate of voice-only nasheeds"]},{id:"muad",name:"Muad",ar:null,origin:"",years:"",line:"Soft, layered vocals: many of his releases come as official vocals-only versions.",facts:["Jannah, with Zain Bhikha, is among his best known","Releases Al-Quran, Ramadan and others as vocals-only versions"]}],Q=(e,t,a)=>({ar:e,en:t,ref:a}),Mv=[{artist:"alafasy",id:"alafasy-tawhid",title:"La Ilaha Illallah",ar:"\u0644\u0627 \u0625\u0644\u0647 \u0625\u0644\u0627 \u0627\u0644\u0644\u0647",meaning:"There Is nasheeds, Vol. 3",year:null,lang:"Arabic",theme:"Love for Arabic, the language the Qur'an chose.",known:!1,verse:Q("\u0625\u0650\u0646\u064E\u0651\u0627 \u0623\u064E\u0646\u0632\u064E\u0644\u0652\u0646\u064E\u0627\u0647\u064F \u0642\u064F\u0631\u0652\u0622\u0646\u064B\u0627 \u0639\u064E\u0631\u064E\u0628\u0650\u064A\u064B\u0651\u0627 \u0644\u064E\u0651\u0639\u064E\u0644\u064E\u0651\u0643\u064F\u0645\u0652 \u062A\u064E\u0639\u0652\u0642\u0650\u0644\u064F\u0648\u0646\u064E","We sent it down as an Arabic Qur'an so that you may understand.","Yusuf 12:2"),scene:"book",tags:["Qur'an","Knowledge"]},{artist:"muqit",id:"muqit-hope",title:"My Hope (Allah)",ar:null,meaning:"My Hope Is Allah",album:"Anasheeds",year:null,lang:"Arabic",theme:"Placing every hope in one place, the only place it cannot be lost.",known:!1,verse:Q("\u0648\u064E\u0645\u064E\u0646 \u064A\u064E\u062A\u064E\u0648\u064E\u0643\u064E\u0651\u0644\u0652 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0641\u064E\u0647\u064F\u0648\u064E \u062D\u064E\u0633\u0652\u0628\u064F\u0647\u064F","Whoever relies on Allah, He is enough for him.","At-Talaq 65:3"),scene:"mountain",tags:["Tawakkul","Hope"]},{artist:"muqit",id:"muqit-tabsirah",title:"Tabsirah",ar:"\u062A\u0628\u0635\u0631\u0629",meaning:"Insight",album:"Anasheeds",year:null,lang:"Arabic",theme:"Tabsirah is a Qur'anic word: something that opens the eyes. The title invites you to see more clearly.",known:!1,verse:Q("\u062A\u064E\u0628\u0652\u0635\u0650\u0631\u064E\u0629\u064B \u0648\u064E\u0630\u0650\u0643\u0652\u0631\u064E\u0649\u0670 \u0644\u0650\u0643\u064F\u0644\u0650\u0651 \u0639\u064E\u0628\u0652\u062F\u064D \u0645\u064F\u0651\u0646\u0650\u064A\u0628\u064D","As insight and a reminder for every servant who turns back to Allah.","Qaf 50:8"),scene:"star",tags:["Reflection"]},{artist:"muqit",id:"muqit-bride",title:"Bride of Light (Wedding Nasheed)",ar:"\u0639\u0631\u0648\u0633\u0629 \u0627\u0644\u0646\u0648\u0631",meaning:"Bride of Light",album:"Anasheeds",year:null,lang:"Arabic",theme:"A wedding nasheed, released music-free: blessings and joy for a new home.",known:!0,verse:Q("\u0648\u064E\u0623\u064E\u0646\u0643\u0650\u062D\u064F\u0648\u0627 \u0627\u0644\u0652\u0623\u064E\u064A\u064E\u0627\u0645\u064E\u0649\u0670 \u0645\u0650\u0646\u0643\u064F\u0645\u0652","Marry off the single among you.","An-Nur 24:32"),scene:"lantern",tags:["Marriage","Joy"]},{artist:"muqit",id:"muqit-uns",title:"Mountains of Friendship",ar:"\u0631\u0628\u0649 \u0627\u0644\u0623\u0646\u0633",meaning:"Hills of Companionship",album:"Single",year:2023,lang:"Arabic",theme:"The comfort of good company, the kind that brings you closer to Allah.",known:!1,verse:Q("\u0648\u064E\u0627\u0639\u0652\u062A\u064E\u0635\u0650\u0645\u064F\u0648\u0627 \u0628\u0650\u062D\u064E\u0628\u0652\u0644\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u062C\u064E\u0645\u0650\u064A\u0639\u064B\u0627 \u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u0641\u064E\u0631\u064E\u0651\u0642\u064F\u0648\u0627","Hold firmly together to the rope of Allah and do not be divided.","Al Imran 3:103"),scene:"mountain",tags:["Brotherhood"]},{artist:"muqit",id:"muqit-wujud",title:"The Beauty of Existence",ar:null,meaning:"The Beauty of Existence",album:"with Hamoud Al-Qahtani",year:null,lang:"Arabic",theme:"Wonder at creation, and at the One behind it.",known:!1,verse:Q("\u0625\u0650\u0646\u064E\u0651 \u0641\u0650\u064A \u062E\u064E\u0644\u0652\u0642\u0650 \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0648\u064E\u0627\u062A\u0650 \u0648\u064E\u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0648\u064E\u0627\u062E\u0652\u062A\u0650\u0644\u064E\u0627\u0641\u0650 \u0627\u0644\u0644\u064E\u0651\u064A\u0652\u0644\u0650 \u0648\u064E\u0627\u0644\u0646\u064E\u0651\u0647\u064E\u0627\u0631\u0650 \u0644\u064E\u0622\u064A\u064E\u0627\u062A\u064D \u0644\u0650\u0651\u0623\u064F\u0648\u0644\u0650\u064A \u0627\u0644\u0652\u0623\u064E\u0644\u0652\u0628\u064E\u0627\u0628\u0650"," pride and without apology.",known:!1,verse:Q("\u0648\u064E\u0645\u064E\u0646\u0652 \u0623\u064E\u062D\u0652\u0633\u064E\u0646\u064F \u0642\u064E\u0648\u0652\u0644\u064B\u0627 \u0645\u0650\u0651\u0645\u064E\u0651\u0646 \u062F\u064E\u0639\u064E\u0627 \u0625\u0650\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0639\u064E\u0645\u0650\u0644\u064E \u0635\u064E\u0627\u0644\u0650\u062D\u064B\u0627 \u0648\u064E\u0642\u064E\u0627\u0644\u064E \u0625\u0650\u0646\u064E\u0651\u0646\u0650\u064A \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u0650\u064A\u0646\u064E","Who is better in speech than one who calls to Allah, does good, and says: I am of the Muslims?","Fussilat 41:33"),scene:"city",tags:["Identity"]},{artist:"muqit",id:"muqit-qaleel",title:"Tabalagh Bil-Qaleel",ar:"\u062A\u0628\u0644\u0651\u063A \u0628\u0627\u0644\u0642\u0644\u064A\u0644",meaning:"Make Do with Little",album:"Anasheeds",year:null,lang:"Arabic",theme:"Contentment: a little, with peace of heart, is more than a lot without it.",known:!1,verse:Q("\u0644\u064E\u064A\u0652\u0633\u064E \u0627\u0644\u0652\u063A\u0650\u0646\u064E\u0649 \u0639\u064E\u0646\u0652 \u0643\u064E\u062B\u0652\u0631\u064E\u0629\u0650 \u0627\u0644\u0652\u0639\u064E\u0631\u064E\u0636\u0650\u060C \u0648\u064E\u0644\u064E\u0643\u0650\u0646\u064E\u0651 \u0627\u0644\u0652\u063A\u0650\u0646\u064E\u0649 \u063A\u0650\u0646\u064E\u0649 \u0627\u0644\u0646\u064E\u0651\u0641\u0652\u0633\u0650","Richness is not having many possessions; true richness is the richness of the soul.","Hadith \xB7 Bukhari & Muslim"),scene:"path",tags:["Dunya","Gratitude"]},{artist:"muqit",id:"muqit-rest",title:"Where I Find Rest",ar:null,meaning:"Where I Find Rest",album:"Anasheeds",year:null,lang:"Arabic",theme:"The search for a place where the heart can finally settle.",known:!1,verse:Q("\u0647\u064F\u0648\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0623\u064E\u0646\u0632\u064E\u0644\u064E \u0627\u0644\u0633\u064E\u0651\u0643\u0650\u064A\u0646\u064E\u0629\u064E \u0641\u0650\u064A \u0642\u064F\u0644\u064F\u0648\u0628\u0650 \u0627\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u0650\u064A\u0646\u064E","It is He who sent down tranquillity into the hearts of the believers.","Al-Fath 48:4"),scene:"night",tags:["Longing","Peace"]},{artist:"arada",id:"arada-turab",title:"Farshi Al-Turab",ar:"\u0641\u0631\u0634\u064A \u0627\u0644\u062A\u0631\u0627\u0628",meaning:"The Dust Is My Bed",album:"Single",year:2004,lang:"Arabic",theme:"The grave, and how briefly we are given this life. He said himself that it is about death, not about the one carried on shoulders. After his own death at 35, it took on a haunting weight.",known:!0,verse:Q("\u0645\u0650\u0646\u0652\u0647\u064E\u0627 \u062E\u064E\u0644\u064E\u0642\u0652\u0646\u064E\u0627\u0643\u064F\u0645\u0652 \u0648\u064E\u0641\u0650\u064A\u0647\u064E\u0627 \u0646\u064F\u0639\u0650\u064A\u062F\u064F\u0643\u064F\u0645\u0652 \u0648\u064E\u0645\u0650\u0646\u0652\u0647\u064E\u0627 \u0646\u064F\u062E\u0652\u0631\u0650\u062C\u064F\u0643\u064F\u0645\u0652 \u062A\u064E\u0627\u0631\u064E\u0629\u064B \u0623\u064F\u062E\u0652\u0631\u064E\u0649\u0670","From it We created you, to it We will return you, and from it We will bring you out once more.","Ta-Ha 20:55"),scene:"path",tags:["Death","Reflection"]},{artist:"arada",id:"arada-sadiqi",title:"Sadiqi",ar:"\u0635\u062F\u064A\u0642\u064A",meaning:"My Friend",album:"Nasheed",year:null,lang:"Arabic",theme:"Friendship, and the friend who still stands by you on the Last Day.",known:!1,verse:Q("\u0627\u0644\u0652\u0623\u064E\u062E\u0650\u0644\u064E\u0651\u0627\u0621\u064F \u064A\u064E\u0648\u0652\u0645\u064E\u0626\u0650\u0630\u064D \u0628\u064E\u0639\u0652\u0636\u064F\u0647\u064F\u0645\u0652 \u0644\u0650\u0628\u064E\u0639\u0652\u0636\u064D \u0639\u064E\u062F\u064F\u0648\u064C\u0651 \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0652\u0645\u064F\u062A\u064E\u0651\u0642\u0650\u064A\u0646\u064E","Close friends will be enemies to one another that Day, except the God-conscious.","Az-Zukhruf 43:67"),scene:"mountain",tags:["Brotherhood"]},{artist:"tarek",id:"tarek-rizq",title:"Tawakkaltu Fi Rizqi 'Ala Allah",ar:"\u062A\u0648\u0643\u0644\u062A \u0641\u064A \u0631\u0632\u0642\u064A \u0639\u0644\u0649 \u0627\u0644\u0644\u0647",meaning:"I Rely on Allah for My Provision",album:"Single",year:2019,lang:"Arabic",theme:"Seeking comfort and protection from Allah, and trusting Him for your provision. The backing voices stand in for percussion and synths.",known:!0,verse:Q("\u0648\u064E\u0645\u064E\u0627 \u0645\u0650\u0646 \u062F\u064E\u0627\u0628\u064E\u0651\u0629\u064D \u0641\u0650\u064A \u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0625\u0650\u0644\u064E\u0651\u0627 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0631\u0650\u0632\u0652\u0642\u064F\u0647\u064E\u0627","There is no creature on earth whose provision is not upon Allah.","Hud 11:6"),scene:"oasis",tags:["Tawakkul"]},{artist:"omar-esa",id:"esa-ramadan",title:"Welcome Ramadan",ar:null,meaning:"Welcome Ramadan",album:"Single",year:2017,lang:"English",theme:"A tender welcome to the holy month, and to the chance it brings to change.",known:!0,verse:Q("\u0634\u064E\u0647\u0652\u0631\u064F \u0631\u064E\u0645\u064E\u0636\u064E\u0627\u0646\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0623\u064F\u0646\u0632\u0650\u0644\u064E \u0641\u0650\u064A\u0647\u0650 \u0627\u0644\u0652\u0642\u064F\u0631\u0652\u0622\u0646\u064F \u0647\u064F\u062F\u064B\u0649 \u0644\u0650\u0651\u0644\u0646\u064E\u0651\u0627\u0633\u0650","The month of Ramadan, in which the Qur'an was sent down as guidance for mankind.","Al-Baqarah 2:185"),scene:"lantern",tags:["Ramadan"]},{artist:"omar-esa",id:"esa-99",title:"99 Names of Allah",ar:null,meaning:"99 Names of Allah",album:"Single",year:2014,lang:"English",theme:"A reflective walk through the names of Allah.",known:!0,verse:Q("\u0648\u064E\u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u0652\u0623\u064E\u0633\u0652\u0645\u064E\u0627\u0621\u064F \u0627\u0644\u0652\u062D\u064F\u0633\u0652\u0646\u064E\u0649\u0670 \u0641\u064E\u0627\u062F\u0652\u0639\u064F\u0648\u0647\u064F \u0628\u0650\u0647\u064E\u0627","To Allah belong the most beautiful names, so call on Him by them.","Al-A'raf 7:180"),scene:"star",tags:["Allah","Tawhid"]},{artist:"omar-esa",id:"esa-beloved",title:"Allah and His Beloved",ar:null,meaning:"Allah and His Beloved",album:"Allah and His Beloved",year:null,lang:"English",theme:"Love for Allah and His Messenger \uFDFA. It reached No. 3 on the iTunes UK chart.",known:!0,verse:Q("\u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u0648\u064E\u0645\u064E\u0644\u064E\u0627\u0626\u0650\u0643\u064E\u062A\u064E\u0647\u064F \u064A\u064F\u0635\u064E\u0644\u064F\u0651\u0648\u0646\u064E \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0646\u064E\u0651\u0628\u0650\u064A\u0650\u0651","Allah and His angels send blessings upon the Prophet.","Al-Ahzab 33:56"),scene:"dome",tags:["Prophet \uFDFA","Allah"]},{artist:"omar-esa",id:"esa-wudu",title:"The Wudu Nasheed",ar:null,meaning:"The Wudu Nasheed",album:"My Muslim Family",year:null,lang:"English",theme:"The steps of wudu, the purification before prayer.",known:!1,verse:Q("\u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u064A\u064F\u062D\u0650\u0628\u064F\u0651 \u0627\u0644\u062A\u064E\u0651\u0648\u064E\u0651\u0627\u0628\u0650\u064A\u0646\u064E \u0648\u064E\u064A\u064F\u062D\u0650\u0628\u064F\u0651 \u0627\u0644\u0652\u0645\u064F\u062A\u064E\u0637\u064E\u0647\u0650\u0651\u0631\u0650\u064A\u0646\u064E","Allah loves those who turn back to Him, and loves those who purify themselves.","Al-Baqarah 2:222"),scene:"rain",tags:["Worship","Children"]},{artist:"omar-esa",id:"esa-father",title:"A Father",ar:null,meaning:"A Father",album:"Single",year:2025,lang:"English",theme:"What a father gives, often without saying it.",known:!1,ver  \u0627\u0644\u0633\u064E\u0651\u0645\u0652\u0639\u064E \u0648\u064E\u0627\u0644\u0652\u0628\u064E\u0635\u064E\u0631\u064E \u0648\u064E\u0627\u0644\u0652\u0641\u064F\u0624\u064E\u0627\u062F\u064E \u0643\u064F\u0644\u064F\u0651 \u0623\u064F\u0648\u0644\u064E\u0670\u0626\u0650\u0643\u064E \u0643\u064E\u0627\u0646\u064E \u0639\u064E\u0646\u0652\u0647\u064F \u0645\u064E\u0633\u0652\u0626\u064F\u0648\u0644\u064B\u0627",en:"Hearing, sight and the heart: each of these will be asked about.",ref:"Al-Isra 17:36"},why:"What goes in through the ears settles somewhere. Today, notice what you hear without choosing to: shops, ads, other people's phones.",do:{silence:"Make one journey in complete silence. No earphones. Just you and your thoughts.",voices:"Make one journey with only a nasheed, or nothing at all. Notice which you reach for."},ask:"What did you hear today that you didn't choose?"},{title:"Fill the gap",ar:"\u0627\u0644\u0630\u0643\u0631",text:{ar:"\u0623\u064E\u0644\u064E\u0627 \u0628\u0650\u0630\u0650\u0643\u0652\u0631\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0637\u0652\u0645\u064E\u0626\u0650\u0646\u064F\u0651 \u0627\u0644\u0652\u0642\u064F\u0644\u064F\u0648\u0628\u064F",en:"Truly, in the remembrance of Allah hearts find rest.",ref:"Ar-Ra'd 13:28"},why:"The hardest part isn't the silence. It's the urge to fill it. Give that urge somewhere better to go.",do:{silence:"Each time you reach for music, say SubhanAllah, Alhamdulillah, Allahu Akbar instead. Count how many times it happens.",voices:"Each time you reach for music, play a nasheed or say a short dhikr instead. Count how many times it happens."},ask:"How many times did you reach for music? When did it happen most?"},{title:"Listen to the best voice",ar:"\u0627\u0644\u0625\u0646\u0635\u0627\u062A",text:{ar:"\u0648\u064E\u0625\u0650\u0630\u064E\u0627 \u0642\u064F\u0631\u0650\u0626\u064E \u0627\u0644\u0652\u0642\u064F\u0631\u0652\u0622\u0646\u064F \u0641\u064E\u0627\u0633\u0652\u062A\u064E\u0645\u0650\u0639\u064F\u0648\u0627 \u0644\u064E\u0647\u064F \u0648\u064E\u0623\u064E\u0646\u0635\u0650\u062A\u064F\u0648\u0627 \u0644\u064E\u0639\u064E\u0644\u064E\u0651\u0643\u064F\u0645\u0652 \u062A\u064F\u0631\u0652\u062D\u064E\u0645\u064F\u0648\u0646\u064E",en:"When the Qur'an is recited, listen to it and be silent, so that you may receive mercy.",ref:"Al-A'raf 7:204"},why:"Every voice on Bila learned from this one. Give the Qur'an the place music used to have, even for ten minutes.",do:{silence:"Listen to one short surah, recited, with its meaning open beside you. Mishary Alafasy's recitation is a good start.",voices:"Listen to one short surah, recited, with its meaning open beside you. Then listen to one nasheed. Notice the difference."},ask:"Which verse stayed with you?"},{title:"Leaving something for Allah",ar:"\u0645\u0646 \u062A\u0631\u0643 \u0634\u064A\u0626\u064B\u0627 \u0644\u0644\u0647",text:{ar:"\u0625\u0650\u0646\u064E\u0651\u0643\u064E \u0644\u064E\u0646\u0652 \u062A\u064E\u062F\u064E\u0639\u064E \u0634\u064E\u064A\u0652\u0626\u064B\u0627 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0625\u0650\u0644\u064E\u0651\u0627 \u0628\u064E\u062F\u064E\u0651\u0644\u064E\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0628\u0650\u0647\u0650 \u0645\u064E\u0627 \u0647\u064F\u0648\u064E \u062E\u064E\u064A\u0652\u0631\u064C \u0644\u064E\u0643\u064E \u0645\u0650\u0646\u0652\u0647\u064F",en:"You will never leave something for Allah's sake except that Allah will replace it with something better.",ref:"Hadith \xB7 Musnad Ahmad"},why:"Halfway. This is usually the day it feels hardest, and the day it starts to feel different.",do:{silence:"Clear one playlist you know you'd go back to. Not forever, just to make the door a little heavier.",voices:"Build a short nasheed playlist for the moments you used to need music: the gym, the drive, the evening."},ask:"What has come into the space music left?"},{title:"Small and steady",ar:"\u0623\u062F\u0648\u0645\u0647\u0627", mah.",sit:"A warning given in love is a gift. He told us so that we would recognise the moment when it arrived.",source:"Sahih al-Bukhari 5590"},{id:"abu-musa",theme:"The voice",title:"A flute of the family of Dawud",who:"Abu Musa al-Ash'ari",ar:"\u0644\u064E\u0642\u064E\u062F\u0652 \u0623\u064F\u0648\u062A\u0650\u064A\u062A\u064E \u0645\u0650\u0632\u0652\u0645\u064E\u0627\u0631\u064B\u0627 \u0645\u0650\u0646\u0652 \u0645\u064E\u0632\u064E\u0627\u0645\u0650\u064A\u0631\u0650 \u0622\u0644\u0650 \u062F\u064E\u0627\u0648\u064F\u062F\u064E",arEn:"You have been given one of the flutes of the family of Dawud.",body:"One night the Prophet \uFDFA passed by Abu Musa reciting the Qur'an alone, and stopped to listen. The next day he told him how beautiful his voice had been, likening it to the voice given to Prophet Dawud. Abu Musa said: had I known you were listening, I would have made it more beautiful still for you.",sit:"The most beautiful voices were never meant for anything less than the words of Allah.",source:"Sahih al-Bukhari 5048; Sahih Muslim 793; the addition in al-Bayhaqi"},{id:"eid-girls",theme:"The voice",title:"Every people has an Eid",who:"Aisha and Abu Bakr",ar:"\u064A\u064E\u0627 \u0623\u064E\u0628\u064E\u0627 \u0628\u064E\u0643\u0652\u0631\u064D\u060C \u0625\u0650\u0646\u064E\u0651 \u0644\u0650\u0643\u064F\u0644\u0650\u0651 \u0642\u064E\u0648\u0652\u0645\u064D \u0639\u0650\u064A\u062F\u064B\u0627\u060C \u0648\u064E\u0647\u064E\u0630\u064E\u0627 \u0639\u0650\u064A\u062F\u064F\u0646\u064E\u0627",arEn:"O Abu Bakr, every people has its Eid, and this is our Eid.",body:"On a day of Eid, two young girls were singing old battle songs with a daff in Aisha's house. Abu Bakr walked in and was alarmed: the sounds of Shaytan, in the house of the Messenger of Allah? The Prophet \uFDFA turned to him gently: leave them, every people has its celebration, and this is ours.",sit:"Scholars draw from this the place of the daff on days of joy. And from Abu Bakr's alarm, how seriously the Companions guarded their hearing on ordinary days.",source:"Sahih al-Bukhari 952; Sahih Muslim 892"},{id:"hassan",theme:"The voice",title:"Poetry with an angel beside it",who:"Hassan ibn Thabit",ar:"\u0627\u0647\u0652\u062C\u064F\u0647\u064F\u0645\u0652 \u0648\u064E\u062C\u0650\u0628\u0652\u0631\u0650\u064A\u0644\u064F \u0645\u064E\u0639\u064E\u0643\u064E",arEn:"Answer them in verse, and Jibril is with you.",body:"When the Quraysh mocked the Prophet \uFDFA in their poems, he turned to Hassan ibn Thabit, the poet of Madinah, and asked him to answer. Hassan's verses cut deeper than any spear. The Prophet \uFDFA told him that Jibril was supporting him as he spoke.",sit:"Words are not neutral. The same tongue that can corrupt can, in the right hands, defend the truth.",source:"Sahih al-Bukhari 4124; Sahih Muslim 2486"},{id:"anjasha",theme:"The voice",title:"Gently, with the glass",who:"Anjasha",ar:"\u0631\u064F\u0648\u064E\u064A\u0652\u062F\u064E\u0643\u064E \u064A\u064E\u0627 \u0623\u064E\u0646\u0652\u062C\u064E\u0634\u064E\u0629\u064F\u060C \u0644\u064E\u0627 \u062A\u064E\u0643\u0652\u0633\u0650\u0631\u0650 \u0627\u0644\u0652\u0642\u064E\u0648\u064E\u0627\u0631\u0650\u064A\u0631\u064E",arEn:"Gently, Anjasha. Do not break the glass vessels.",body:"Anjasha drove the camels on a journey with the women riding, and he had a beautiful voice for the huda, the chant that speeds the camels on. As his voice rose, the camels quickened. The Prophet \uFDFA called out to him to go gently, for he was carrying vessels of glass.",sit:"A voice has power over animals, over hearts, over the pace of a whole caravan. The Prophet \uFDFA never forgot who it was moving.",source:"Sahih al-Bukhari 6149; Sahih Muslim 2323"},{id:"bilal-voice",theme:"The voice",title:"The voice chosen for the adhan",who:"Bilal ibn Rabah",ar:"\u0641\u064E\u0625\u0650\u0646\u064E\u0651\u0647\u064F \u0623\u064E\u0646\u0652\u062F\u064E\u0649 \u0635\u064E\u0648\u0652\u062A\u064B\u0627 \u0645\u0650\u0646\u0652\u0643\u064E",arEn:"For his voice is fuller and more far-reaching than yours.",body:"Abdullah ibn Zayd saw the words of the adhan in a dream and came to tell the Prophet \uFDFA. It was a true vision, he said, but teach it to Bilal: his voice carries further. So the freed slave once tortured on the burning sand of Makkah became the voice that called a whole city to prayer.",sit:"Allah did not give Bilal his voice for nothing. Ask what yours is for.",source:"Sunan Abi Dawud 499; Jami' at-Tirmidhi 189"},{id:"abu-dharr",theme:"Character",title:"The insult that came back",who:"Abu Dharr al-Ghifari",ar:"\u0625\u0650\u0646\u064E\u0651\u0643\u064E \u0627\u0645\u0652\u0631\u064F\u0624\u064C \u0641\u0650\u064A\u0643\u064E \u062C\u064E\u0627\u0647\u0650\u0644\u0650\u064A\u064E\u0651\u0629\u064C",arEn:"You are a man who still has some ignorance in him.",body:"In anger, Abu Dharr insulted a man by mocking his mother's origins. The Prophet \uFDFA told him plainly: there is still some jahiliyyah in you. Your servants are your brothers. Feed them what you eat and clothe them as you dress. Years later, people saw Abu Dharr and his servant wearing matching garments, and asked why.",sit:"He was a great Companion, and still he was corrected. Greatness is not never falling; it is how you change after.",source:"Sahih al-Bukhari 30; Sahih Muslim 1661"},{id:"kab",theme:"Repentance",title:"Fifty nights of silence",who:"Ka'b ibn Malik",ar:"\u0648\u064E\u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u062B\u064E\u0651\u0644\u064E\u0627\u062B\u064E\u0629\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A\u0646\u064E \u062E\u064F\u0644\u0650\u0651\u0641\u064F\u0648\u0627",arEn:"And upon the three who were left behind\u2026",body:"Ka'b stayed behind from the expedition to Tabuk with no excuse. When the army returned, others made up reasons. Ka'b told the truth. For fifty days no one in Madinah spoke to him; the earth, he said, felt narrow despite its vastness. Then the verses came down: Allah had accepted their repentance. He gave away his clothes to the man who brought the news.",sit:"Honesty cost him fifty hard days. The excuses cost the others far more.",source:"Sahih al-Bukhari 4418; Sahih Muslim 2769; Qur'an 9:118"},{id:"dog",theme:"Mercy",title:"The man, the well and the dog",who:"Told by the Prophet \uFDFA",ar:"\u0641\u0650\u064A \u0643\u064F\u0644\u0650\u0651 \u0643\u064E\u0628\u0650\u062F\u064D \u0631\u064E\u0637\u0652\u0628\u064E\u0629\u064D \u0623\u064E\u062C\u0652\u0631\u064C",arEn:"In every living creature there is a reward.",body:"A man walking in the heat found a well, climbed down and drank. When he came up, a dog was panting and licking the damp earth from thirst. He climbed back down, filled his leather sock with water, held it in his teeth as he climbed, and gave the dog a drink. Allah thanked him and forgave him.",sit:"No one saw him. There was no reward to expect. That was exactly why it counted.",source:"Sahih al-Bukhari 2363; Sahih Muslim 2244"},{id:"abu-bakr-wealth",theme:"Sacrifice",title:"What did you leave for your family?",who:"Abu Bakr and Umar",ar:"\u0623\u064E\u0628\u0652\u0642\u064E\u064A\u0652\u062A\u064F \u0644\u064E\u0647\u064F\u0645\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u0648\u064E\u0631\u064E\u0633\u064F\u0648\u0644\u064E\u0647\u064F",arEn:"I left them Allah and His Messenger.",body:"When the Prophet \uFDFA asked for charity, Umar thought: today I will outdo Abu Bakr. He brought half of everything he owned. Abu Bakr came with all of it. Asked what he had left his family, he answered: Allah and His Messenger. Umar said he knew then he would never surpass him.",sit:"Umar's half was enormous. The lesson is not the amount, but the heart that leaves nothing back.",source:"Sunan Abi Dawud 1678; Jami' at-Tirmidhi 3675"},{id:"lamp",theme:"Sacrifice",title:"The lamp put out",who:"Abu Talha and Umm Sulaym",ar:"\u0648\u064E\u064A\u064F\u0624\u0652\u062B\u0650\u0631\u064F\u0648\u0646\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0623\u064E\u0646\u0641\u064F\u0633\u0650\u0647\u0650\u0645\u0652 \u0648\u064E\u0644\u064E\u0648\u0652 \u0643\u064E\u0627\u0646\u064E \u0628\u0650\u0647\u0650\u0645\u0652 \u062E\u064E\u0635\u064E\u0627\u0635\u064E\u0629\u064C",arEn:"They prefer others above themselves, even when they are in need.",body:"A hungry guest came to the Prophet \uFDFA and Abu Talha took him home. There was only enough food for the children. Umm Sulaym settled the children to sleep, served the guest, and put out the lamp so he would not see that his hosts' hands were empty. In the morning, the Prophet \uFDFA told them Allah had marvelled at what they did, and a verse was revealed about them.",sit:"They hid their generosity in the dark. Allah brought it into the Qur'an.",source:"Sahih al-Bukhari 3798; Sahih Muslim 2054; Qur'an 59:9"},{id:"ibn-masud",theme:"Faith",title:"\u201CEnough for now\u201D",who:"Abdullah ibn Mas'ud",ar:"\u062D\u064E\u0633\u0652\u0628\u064F\u0643\u064E \u0627\u0644\u0652\u0622\u0646\u064E",arEn:"That is enough for now.",body:"The Prophet \uFDFA asked Ibn Mas'ud to recite the Qur'an to him. Shall I recite to you, when it was revealed to you? I love to hear it from someone else, he said. Ibn Mas'ud recited from Surah an-Nisa' until the verse about bringing a witness from every nation, and you as a witness over these. Enough, said the Prophet \uFDFA. Ibn Mas'ud looked up, and his eyes were flowing with tears.",sit:"The one to whom the Qur'an was revealed still wept when he heard it. How do we listen?",source:"Sahih al-Bukhari 5050; Sahih Muslim 800"},{id:"thumama",theme:"Mercy",title:"Three days in the masjid",who:"Thumama ibn Uthal",body:"Thumama, a chief of Yamamah, was captured and tied to a pillar of the masjid. Each day the Prophet \uFDFA asked him how he was, and each day he answered proudly. On the third day the Prophet \uFDFA simply set him free. Thumama went out, bathed, came back and declared his faith: no face had been more hateful to me than yours, and now no face is more beloved.",sit:"He was not argued into Islam. He watched it, for three days, and then he could not leave.",source:"Sahih al-Bukhari 4372; Sahih Muslim 1764"},{id:"musab",theme:"Sacrifice",title:"The shroud that was too short",who:"Mus'ab ibn Umayr",body:"Mus'ab had been the best-dressed young man in Makkah, known by the scent of his perfume. He gave it all up for Islam, became the first envoy to Madinah, and fell at Uhud. When they came to shroud him, his only cloak would cover his head or his feet, not both. They covered his head and laid grass over his feet.",sit:"He arrived in this world with everything and left it with almost nothing. He did not lose the trade.",source:"Sahih al-Bukhari 1276; Sahih Muslim 940"},{id:"cave-three",theme:"Faith",title:"Three men and a boulder",who:"Told by the Prophet \uFDFA",body:"Three travellers sheltered in a cave and a rock sealed the entrance. Each called on Allah by a deed done only for Him: one who never ate before serving his elderly parents, one who walked away from a sin at the very moment he could have done it, one who grew a worker's forgotten wages into a herd and handed it all over. With each du'a, the rock moved a little. After the third, they walked out.",sit:"One day you may need a deed that no one knows about. Have you hidden one away?",source:"Sahih al-Bukhari 2272; Sahih Muslim 2743"},{id:"umm-salamah",theme:"Faith",title:"Who could be better than Abu Salamah?",who:"Umm Salamah",ar:"\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u0652\u062C\u064F\u0631\u0652\u0646\u0650\u064A \u0641\u0650\u064A \u0645\u064F\u0635\u0650\u064A\u0628\u064E\u062A\u0650\u064A \u0648\u064E\u0623\u064E\u062E\u0652\u0644\u0650\u0641\u0652 \u0644\u0650\u064A \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0645\u0650\u0646\u0652\u0647\u064E\u0627",arEn:"O Allah, reward me in my loss and replace it with something better.",body:"The Prophet \uFDFA taught that whoever is struck by loss and says this du'a will be given better. When her beloved husband Abu Salamah died, Umm Salamah said it, while asking herself: what Muslim could be better than him? She said it anyway. The Prophet \uFDFA himself proposed to her.",sit:"She made the du'a while her heart still doubted. That was enough.",source:"Sahih Muslim 918"},{id:"bedouin",theme:"Mercy",title:"Let him finish",who:"A Bedouin in the masjid",ar:"\u0625\u0650\u0646\u064E\u0651\u0645\u064E\u0627 \u0628\u064F\u0639\u0650\u062B\u0652\u062A\u064F\u0645\u0652 \u0645\u064F\u064A\u064E\u0633\u0650\u0651\u0631\u0650\u064A\u0646\u064E \u0648\u064E\u0644\u064E\u0645\u0652 \u062A\u064F\u0628\u0652\u0639\u064E\u062B\u064F\u0648\u0627 \u0645\u064F\u0639\u064E\u0633\u0650\u0651\u0631\u0650\u064A\u0646\u064E",arEn:"You were sent to make things easy, not to make them hard.",body:"A Bedouin walked into the masjid of the Prophet \uFDFA and urinated in a corner. The Companions leapt up to stop him. Leave him, said the Prophet \uFDFA. When he had finished, a bucket of water was poured over the place, and the man was taught, kindly, what a masjid is for.",sit:"Correction delivered with mercy reaches further than correction delivered in anger.",source:"Sahih al-Bukhari 220; Sahih Muslim 285"},{id:"hanzala",theme:"Faith",title:"\u201CHanzala has become a hypocrite\u201D",who:"Hanzala al-Usaydi",ar:"\u0633\u064E\u0627\u0639\u064E\u0629\u064B \u0648\u064E\u0633\u064E\u0627\u0639\u064E\u0629\u064B",arEn:"An hour for this, and an hour for that.",body:"Hanzala met Abu Bakr in the street, distraught. With the Prophet \uFDFA, he said, it is as if I can see Paradise and the Fire; then I go home to my wife and children and forget. Abu Bakr said: I feel the same. They went to the Prophet \uFDFA, who told them that if they stayed in that state always, angels would shake their hands in the streets. But Hanzala: an hour and an hour.",sit:"Faith rises and falls. The worry that you are not as close as you were is itself a sign of life in the heart.",source:"Sahih Muslim 2750"},{id:"ukkasha",theme:"Faith",title:"Ukkasha got there first",who:"Ukkasha ibn Mihsan",ar:"\u0633\u064E\u0628\u064E\u0642\u064E\u0643\u064E \u0628\u0650\u0647\u064E\u0627 \u0639\u064F\u0643\u064E\u0651\u0627\u0634\u064E\u0629\u064F",arEn:"Ukkasha has beaten you to it.",body:"The Prophet \uFDFA spoke of seventy thousand of his Ummah who would enter Paradise without reckoning. Ukkasha stood immediately: ask Allah to make me one of them. You are one of them, he was told. Another man stood and asked the same. Ukkasha has beaten you to it, came the reply.",sit:"Some doors open for those who ask first. Do not wait to be the second.",source:"Sahih al-Bukhari 5705; Sahih Muslim 216"},{id:"sad",theme:"Sacrifice",title:"The Throne shook",who:"Sa'd ibn Mu'adh",ar:"\u0627\u0647\u0652\u062A\u064E\u0632\u064E\u0651 \u0627\u0644\u0652\u0639\u064E\u0631\u0652\u0634\u064F \u0644\u0650\u0645\u064E\u0648\u0652\u062A\u0650 \u0633\u064E\u0639\u0652\u062F\u0650 \u0628\u0652\u0646\u0650 \u0645\u064F\u0639\u064E\u0627\u0630\u064D",arEn:"The Throne shook at the death of Sa'd ibn Mu'adh.",body:"Sa'd was a chief of the Aws who embraced Islam and brought his whole tribe with him in a single day. He was wounded at the Trench and died soon after, still young. The Prophet \uFDFA said that the Throne of the Most Merciful shook at his death.",sit:"He was a Muslim for only a few years. It is not how long you have, but what you do with it.",source:"Sahih al-Bukhari 3803; Sahih Muslim 2466"},{id:"trunk",theme:"Mercy",title:"The palm trunk that wept",who:"The Prophet \uFDFA",body:"The Prophet \uFDFA used to deliver his sermons leaning on the trunk of a date palm. When a pulpit was built and he moved to it, the trunk let out a cry like a child's, so loud the whole masjid heard it. He stepped down and held it until it quietened, like a child being comforted.",sit:"A piece of wood longed for him when he moved a few steps away. What should our hearts feel?",source:"Sahih al-Bukhari 3583, 3584"}
